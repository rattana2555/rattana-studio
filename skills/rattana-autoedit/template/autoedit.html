<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>rattana-autoedit render page v1.1</title>
<style>
:root{--navy:#0B1530;--gold:#C9A84C;--gold2:#E6C878;--hl:#FFE14D;--hl2:#3DDC84;--red:#FF4D5E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Leelawadee UI",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
#v{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 38%}
#vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 22%,transparent 62%,rgba(0,0,0,.55));pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
/* captions */
#cap{position:absolute;left:60px;right:60px;top:1250px;text-align:center;line-height:1.25}
#cap .ln{display:block;white-space:nowrap}
#cap .wd{display:inline-block;font-weight:700;font-size:86px;color:#fff;paint-order:stroke fill;-webkit-text-stroke:14px #000;text-shadow:0 8px 18px rgba(0,0,0,.45);margin:0 6px}
#cap.box .wd{-webkit-text-stroke:0;text-shadow:0 4px 12px rgba(0,0,0,.6);padding:2px 16px 10px;border-radius:16px}
#cap.box .wd.on{background:var(--hl);color:#111}
#cap.gold .wd{-webkit-text-stroke:0;color:#fff;text-shadow:none;font-size:70px;margin:0 4px}
#cap.gold{min-height:205px;display:flex;flex-direction:column;justify-content:center;background:rgba(11,21,48,.9);border-radius:28px;padding:18px 26px 26px;left:80px;right:80px;border:3px solid var(--gold)}
#cap.gold .wd.on{color:var(--gold2)}
/* titles */
.title{position:absolute;left:60px;right:60px;text-align:center;opacity:0}
.title .main{display:inline-block;font-weight:700;font-size:104px;line-height:1.15;color:#fff;padding:14px 34px 22px;border-radius:24px;white-space:nowrap}
.title .sub{display:block;margin-top:14px;font-weight:700;font-size:56px;color:#fff;paint-order:stroke fill;-webkit-text-stroke:10px #000}
.title.pop .main{background:var(--red);transform:rotate(-3deg);box-shadow:0 14px 30px rgba(0,0,0,.4)}
.title.banner .main{background:var(--navy);color:var(--gold2);border:4px solid var(--gold);font-size:80px}
.title.yellow .main{background:var(--hl);color:#111;transform:rotate(2deg)}
#prog{position:absolute;left:0;bottom:0;height:10px;background:var(--gold)}
</style>
</head>
<body>
<div id="stage">
  <video id="v" src="cut.webm" muted playsinline preload="auto"></video>
  <div id="vig"></div>
  <div id="titles"></div>
  <div id="cap"></div>
  <div id="flash"></div>
  <div id="prog"></div>
</div>
<script src="edit.js"></script>
<script src="vo.js"></script>
<script>
'use strict';
const E = window.EDIT;
window.VIDEO = { w: 1080, h: 1920, duration: E.duration };
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const set = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const v = $('v'), cap = $('cap');
cap.className = E.capStyle || 'pop';
if (E.capTop) cap.style.top = E.capTop + 'px';

$('titles').innerHTML = (E.titles || []).map((ti, i) => `<div class="title ${ti.style || 'pop'}" id="ti${i}" style="top:${ti.y ?? 260}px"><span class="main">${ti.text}</span>${ti.sub ? `<span class="sub">${ti.sub}</span>` : ''}</div>`).join('');
const titles = (E.titles || []).map((ti, i) => ({ ...ti, el: $('ti' + i) }));
const cuts = E.cuts || [];                        // start time of each kept range on the new timeline

function seekVideo(time) {
  return new Promise(res => {
    if (v.readyState >= 2 && Math.abs(v.currentTime - time) < .001) return res();
    const done = () => { v.removeEventListener('seeked', done); res(); };
    v.addEventListener('seeked', done); v.currentTime = Math.min(time, (v.duration || 1e4) - .04);
  });
}
const ready = new Promise(r => v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true }));
let lastCap = -1;

window.seek = async function (t) {
  await ready; await seekVideo(t);
  // camera: alternate punch-in per jump cut + keyword zooms
  let ci = 0; cuts.forEach((c, i) => { if (t >= c) ci = i; });
  let sc = ci % 2 ? 1.08 : 1.0;
  for (const z of E.zooms || []) { const a = eOut(prog(t, z.s, .25)), b = eIO(prog(t, z.e, .35)); sc *= lerp(1, z.scale || 1.18, a * (1 - b)); }
  const drift = 1 + (t % 7) * .003;
  v.style.transform = `scale(${sc * drift})`;
  // white flash on cuts flagged in E.flash
  let fl = 0; (E.flash || []).forEach(f => { const p = prog(t, f, .18); if (p > 0 && p < 1) fl = Math.max(fl, (1 - p) * .55); }); $('flash').style.opacity = fl;
  // titles
  for (const ti of titles) {
    const pin = prog(t, ti.s, .32), pout = prog(t, ti.e - .2, .2), on = t >= ti.s && t < ti.e;
    set(ti.el, { opacity: on ? clamp(pin * 3) * (1 - pout) : 0, transform: `scale(${lerp(.4, 1, eBack(pin))}) translateY(${(1 - eOut(pin)) * -30}px)` });
  }
  // captions: one line group at a time, active word highlighted (CapCut karaoke)
  const idx = (E.captions || []).findIndex(c => t >= c.s && t < c.e);
  if (idx !== lastCap) {
    lastCap = idx;
    cap.innerHTML = idx < 0 ? '' : E.captions[idx].lines.map(ln => `<span class="ln">${ln.map(w => `<span class="wd" data-s="${w.s}" data-e="${w.e}"${w.c ? ` data-c="${w.c}"` : ''}>${w.t}</span>`).join('')}</span>`).join('');
  }
  if (idx >= 0) {
    const c = E.captions[idx], p = prog(t, c.s, .14);
    cap.style.opacity = clamp(p * 3); cap.style.transform = `translateY(${(1 - eOut(p)) * 24}px)`;
    cap.querySelectorAll('.wd').forEach(w => {
      const s = +w.dataset.s, e = +w.dataset.e, on = t >= s && t < Math.max(e, s + .12);
      w.classList.toggle('on', on);
      const cpop = eBack(prog(t, s, .16));
      const col = w.dataset.c;            // emphasis colour for key words
      if (cap.className === 'pop') w.style.color = on || (col && t >= s) ? (col || 'var(--hl)') : '#fff';
      w.style.transform = on ? `scale(${lerp(1, 1.12, cpop)})` : (t < s ? 'scale(1)' : 'scale(1)');
    });
  } else cap.style.opacity = 0;
  $('prog').style.width = (t / E.duration * 1080) + 'px';
};

/* audio: speech + synth music bed (ducked) + sfx */
window.buildAudio = async function (ctx) {
  const sr = ctx.sampleRate, D = E.duration, out = ctx.createGain(); out.connect(ctx.destination);
  const bin = atob(window.VO), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const vb = await ctx.decodeAudioData(u8.buffer); const vs = ctx.createBufferSource(); vs.buffer = vb;
  const vg = ctx.createGain(); vg.gain.value = 1; vs.connect(vg).connect(out); vs.start(0);
  const mus = ctx.createGain(); mus.connect(out);
  const M = E.music || { bpm: 104, level: .1 };
  mus.gain.setValueAtTime(0, 0); mus.gain.linearRampToValueAtTime(M.level, .5); mus.gain.setValueAtTime(M.level, D - 1.4); mus.gain.linearRampToValueAtTime(0, D);
  const noise = ctx.createBuffer(1, sr, sr), nd = noise.getChannelData(0); let seed = 11; for (let i = 0; i < sr; i++) { seed = (seed * 16807) % 2147483647; nd[i] = seed / 1073741823.5 - 1; }
  const beat = 60 / M.bpm, mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const CH = M.chords || [[60, 64, 67, 72], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67]];
  for (let b = 0, at = 0; at < D; b++, at = b * beat) {
    { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(120, at); o.frequency.exponentialRampToValueAtTime(42, at + .15); g.gain.setValueAtTime(.8, at); g.gain.exponentialRampToValueAtTime(.001, at + .3); o.connect(g).connect(mus); o.start(at); o.stop(at + .32); }
    { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise; f.type = 'highpass'; f.frequency.value = 7500; const h = at + beat / 2; g.gain.setValueAtTime(.18, h); g.gain.exponentialRampToValueAtTime(.001, h + .05); s.connect(f).connect(g).connect(mus); s.start(h, (b * .037) % .5); s.stop(h + .06); }
    if (b % 2 === 1) { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise; f.type = 'bandpass'; f.frequency.value = 1800; g.gain.setValueAtTime(.35, at); g.gain.exponentialRampToValueAtTime(.001, at + .14); s.connect(f).connect(g).connect(mus); s.start(at, (b * .05) % .5); s.stop(at + .15); }
    if (b % 4 === 0) {
      const ch = CH[(b / 4) % CH.length];
      ch.forEach(m => { const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = mtof(m); f.type = 'lowpass'; f.frequency.value = 1400; g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.03, at + .2); g.gain.setTargetAtTime(0, at + beat * 3.6, .2); o.connect(f).connect(g).connect(mus); o.start(at); o.stop(at + beat * 4.5); });
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = mtof(ch[0] - 24); g.gain.setValueAtTime(.22, at); g.gain.setTargetAtTime(0, at + beat * 3.4, .15); o.connect(g).connect(mus); o.start(at); o.stop(at + beat * 4.2);
    }
  }
  const sfx = ctx.createGain(); sfx.gain.value = .5; sfx.connect(out);
  const S = {
    whoosh: at => { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise; f.type = 'bandpass'; f.frequency.setValueAtTime(350, at); f.frequency.exponentialRampToValueAtTime(3800, at + .35); g.gain.setValueAtTime(.001, at); g.gain.exponentialRampToValueAtTime(.55, at + .18); g.gain.exponentialRampToValueAtTime(.001, at + .4); s.connect(f).connect(g).connect(sfx); s.start(at); s.stop(at + .45); },
    pop: at => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(480, at); o.frequency.exponentialRampToValueAtTime(1100, at + .08); g.gain.setValueAtTime(.45, at); g.gain.exponentialRampToValueAtTime(.001, at + .12); o.connect(g).connect(sfx); o.start(at); o.stop(at + .14); },
    ding: at => [1318, 1976].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.22 / (i + 1), at); g.gain.exponentialRampToValueAtTime(.001, at + .9); o.connect(g).connect(sfx); o.start(at); o.stop(at + 1); }),
    boom: at => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, at); o.frequency.exponentialRampToValueAtTime(38, at + .45); g.gain.setValueAtTime(.9, at); g.gain.exponentialRampToValueAtTime(.001, at + .55); o.connect(g).connect(sfx); o.start(at); o.stop(at + .6); },
    click: at => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.setValueAtTime(2300, at); g.gain.setValueAtTime(.08, at); g.gain.exponentialRampToValueAtTime(.001, at + .03); o.connect(g).connect(sfx); o.start(at); o.stop(at + .04); },
    cash: at => { S.ding(at); [2637, 3136].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.08, at + .05 * i); g.gain.exponentialRampToValueAtTime(.001, at + .3 + .05 * i); o.connect(g).connect(sfx); o.start(at + .05 * i); o.stop(at + .35 + .05 * i); }); },
  };
  for (const c of E.sfx || []) S[c.type] && S[c.type](c.t);
};
if (!location.search.includes('render')) window.seek(0);
</script>
</body>
</html>
